<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mu's Cover Letter Generator</title>
    <link rel="stylesheet" href="/samx-theme.css">
    <style>
        .generator-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }
        .preview-panel {
            position: sticky;
            top: 5rem;
            background: var(--sx-soft-2);
            border: 1px solid var(--sx-line);
            border-radius: var(--sx-radius-lg);
            padding: 2.5rem;
        }
        .letter-preview {
            background: #fff;
            border: 1px solid var(--sx-line);
            border-radius: var(--sx-radius-md);
            padding: 2.5rem;
            font-family: var(--sx-font-body);
            font-size: 0.95rem;
            line-height: 1.8;
            white-space: pre-wrap;
            box-shadow: var(--sx-shadow-sm);
            min-height: 420px;
            color: var(--sx-fg);
        }
        .action-cluster {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }
        .link-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            border: 1px solid var(--sx-line);
            border-radius: var(--sx-radius-sm);
            padding: 0.5rem 0.75rem;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border: 1px solid var(--sx-line-strong);
            border-radius: var(--sx-radius-lg);
            padding: 2rem;
            width: min(90%, 480px);
            box-shadow: var(--sx-shadow-lg);
        }
        @media (max-width: 960px) {
            .generator-grid { grid-template-columns: 1fr; }
            .preview-panel { position: relative; top: 0; }
            .nav-title { display: none; }
        }
    </style>
</head>
<body class="samx-theme">

    <nav class="sx-nav">
        <div class="sx-cluster">
            <span class="sx-pill sx-mono">Generator v2.0</span>
        </div>
        <div style="font-weight: 700; font-family: var(--sx-font-display); font-size: 0.9rem; text-align: center;" class="nav-title">
            Mu's Cover Letter Generator
        </div>
        <div class="sx-cluster">
            <button class="sx-btn sx-btn--secondary" id="reset-btn">Reset Form</button>
        </div>
    </nav>

    <main class="sx-container sx-section">
        <div class="generator-grid">
            
            <!-- Left: Control Parameters Form -->
            <div class="sx-panel">
                <div class="sx-eyebrow" style="margin-bottom: 1rem;">Parameters</div>
                <h2 class="sx-heading--section" style="font-size: 2rem; margin-bottom: 1.5rem;">Configure Details</h2>

                <div class="sx-stack" style="gap: 1.25rem;">
                    <div class="sx-field">
                        <label class="sx-label">Your Full Name</label>
                        <input type="text" id="input-name" class="sx-input" placeholder="e.g. Dewan Mukto" value="Dewan Mukto">
                    </div>
                    <div class="sx-field">
                        <label class="sx-label">Target Job Title</label>
                        <input type="text" id="input-title" class="sx-input" placeholder="e.g. Software Engineer">
                    </div>
                    <div class="sx-field">
                        <label class="sx-label">Company Name</label>
                        <input type="text" id="input-company" class="sx-input" placeholder="e.g. Acme Corp">
                    </div>
                    <div class="sx-field">
                        <label class="sx-label">Job Location</label>
                        <input type="text" id="input-location" class="sx-input" placeholder="e.g. San Francisco, CA">
                    </div>
                    
                    <!-- Single-Choice Job Type -->
                    <div class="sx-field">
                        <label class="sx-label">Job Type</label>
                        <div class="sx-cluster" style="gap: 0.5rem;" id="job-type-group">
                            <button type="button" class="sx-btn sx-btn--primary job-type-btn" data-val="Remote" style="flex: 1; min-height: 42px; font-size: 0.8rem;">Remote</button>
                            <button type="button" class="sx-btn sx-btn--secondary job-type-btn" data-val="Hybrid" style="flex: 1; min-height: 42px; font-size: 0.8rem;">Hybrid</button>
                            <button type="button" class="sx-btn sx-btn--secondary job-type-btn" data-val="On-site" style="flex: 1; min-height: 42px; font-size: 0.8rem;">On-site</button>
                        </div>
                    </div>

                    <div class="sx-field">
                        <label class="sx-label">Years of Experience</label>
                        <input type="text" id="input-exp" class="sx-input" placeholder="e.g. 3+ years">
                    </div>
                    <div class="sx-field">
                        <label class="sx-label">Main Skills</label>
                        <input type="text" id="input-skills" class="sx-input" placeholder="e.g. JavaScript, Python, System Architecture">
                    </div>
                    <div class="sx-field">
                        <label class="sx-label">Portfolio Project Type (Optional)</label>
                        <input type="text" id="input-project" class="sx-input" placeholder="e.g. an AI-powered SaaS platform">
                    </div>
                    <div class="sx-field">
                        <label class="sx-label">Achievement (Optional)</label>
                        <input type="text" id="input-achievement" class="sx-input" placeholder="e.g. scaling application performance by 40%">
                    </div>
                    <div class="sx-field">
                        <label class="sx-label">Recent Academic Degree</label>
                        <input type="text" id="input-degree" class="sx-input" placeholder="e.g. B.Sc. in Computer Science">
                    </div>
                    <div class="sx-field">
                        <label class="sx-label">Institute Name</label>
                        <input type="text" id="input-institute" class="sx-input" placeholder="e.g. University of Technology">
                    </div>

                    <!-- Social / Professional Links Management -->
                    <div class="sx-field" style="margin-top: 1rem;">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                            <label class="sx-label" style="margin: 0;">Professional Links & Websites</label>
                            <button type="button" class="sx-btn sx-btn--secondary" id="add-link-btn" style="min-height: 32px; padding: 0.25rem 0.75rem; font-size: 0.75rem;">+ Add Link</button>
                        </div>
                        <div id="links-container"></div>
                    </div>
                </div>
            </div>

            <!-- Right: Live Preview & Export Suite -->
            <div class="preview-panel">
                <div class="sx-eyebrow" style="margin-bottom: 1rem;">Live Output</div>
                <h3 style="font-size: 1.5rem; margin-bottom: 1.5rem;">Generated Letter</h3>
                
                <div class="letter-preview" id="letter-output">Loading template...</div>

                <div class="action-cluster">
                    <button class="sx-btn sx-btn--secondary" id="copy-btn">Copy Text</button>
                    <button class="sx-btn sx-btn--secondary" id="download-txt-btn">Download TXT</button>
                    <button class="sx-btn sx-btn--secondary" id="download-doc-btn">Download DOC</button>
                    <button class="sx-btn sx-btn--secondary" id="download-pdf-btn">Download PDF</button>
                    <button class="sx-btn sx-btn--primary" id="send-direct-btn" style="flex: 1; justify-content: center;">Send Directly</button>
                </div>
            </div>

        </div>
    </main>

    <!-- Add Link Modal -->
    <div class="modal-overlay" id="link-modal">
        <div class="modal-box">
            <h3 style="margin-bottom: 1rem; font-size: 1.5rem;">Add Link</h3>
            <div class="sx-stack" style="gap: 1rem; margin-bottom: 1.5rem;">
                <div class="sx-field">
                    <label class="sx-label">Website / Link Name</label>
                    <input type="text" id="modal-link-name" class="sx-input" placeholder="e.g. Portfolio website link">
                </div>
                <div class="sx-field">
                    <label class="sx-label">URL</label>
                    <input type="url" id="modal-link-url" class="sx-input" placeholder="https://...">
                </div>
            </div>
            <div class="sx-cluster" style="justify-content: flex-end;">
                <button class="sx-btn sx-btn--secondary" id="link-modal-cancel">Cancel</button>
                <button class="sx-btn sx-btn--primary" id="link-modal-submit">Add Link</button>
            </div>
        </div>
    </div>

    <!-- Send Directly Modal -->
    <div class="modal-overlay" id="email-modal">
        <div class="modal-box">
            <h3 style="margin-bottom: 1rem; font-size: 1.5rem;">Direct Email Dispatch</h3>
            <p class="sx-muted" style="font-size: 0.85rem; margin-bottom: 1.5rem;">Enter recipient email and subject line to launch your default mail app.</p>
            <div class="sx-stack" style="gap: 1rem; margin-bottom: 1.5rem;">
                <div class="sx-field">
                    <label class="sx-label">Recipient Email</label>
                    <input type="email" id="modal-email" class="sx-input" placeholder="hiring@company.com">
                </div>
                <div class="sx-field">
                    <label class="sx-label">Email Subject</label>
                    <input type="text" id="modal-subject" class="sx-input" placeholder="Application for [Job Title]">
                </div>
            </div>
            <div class="sx-cluster" style="justify-content: flex-end;">
                <button class="sx-btn sx-btn--secondary" id="modal-cancel">Cancel</button>
                <button class="sx-btn sx-btn--primary" id="modal-submit">Launch Mail App</button>
            </div>
        </div>
    </div>

    <footer class="sx-footer">
        <div class="sx-container" style="display: flex; justify-content: space-between; align-items: center;">
            <span class="sx-mono" id="time-display">00:00:00</span>
            <span class="sx-mono">Made by <a href="https://dewanmukto.github.io/" target="_blank" rel="noopener" style="text-decoration: underline; color: var(--sx-fg);">Dewan Mukto</a></span>
        </div>
    </footer>

    <script>
        function updateClock() {
            const now = new Date();
            document.getElementById('time-display').textContent = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        let jobType = 'Remote';
        const fields = {
            name: document.getElementById('input-name'),
            title: document.getElementById('input-title'),
            company: document.getElementById('input-company'),
            location: document.getElementById('input-location'),
            exp: document.getElementById('input-exp'),
            skills: document.getElementById('input-skills'),
            project: document.getElementById('input-project'),
            achievement: document.getElementById('input-achievement'),
            degree: document.getElementById('input-degree'),
            institute: document.getElementById('input-institute')
        };

        // Preloaded default links as requested
        let customLinks = [
            { name: 'CV / Resume link', url: 'https://dewanmukto.github.io/resume_cs.pdf' },
            { name: 'Portfolio website link', url: 'https://dewanmukto.github.io/' },
            { name: 'GitHub profile link', url: 'https://github.com/dwmk' },
            { name: 'LinkedIn profile link', url: 'https://www.linkedin.com/in/dewanmukto' }
        ];

        const outputEl = document.getElementById('letter-output');
        const linksContainer = document.getElementById('links-container');

        function renderLinksList() {
            linksContainer.innerHTML = customLinks.map((l, index) => `
                <div class="link-item-row">
                    <span style="font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px;" title="${l.name}">${l.name}</span>
                    <button type="button" class="sx-btn sx-btn--secondary" style="min-height: 26px; padding: 0.15rem 0.5rem; font-size: 0.7rem;" onclick="removeLink(${index})">Remove</button>
                </div>
            `).join('');
            updatePreview();
        }

        window.removeLink = function(index) {
            customLinks.splice(index, 1);
            renderLinksList();
        }

        // Job Type single-choice buttons
        document.querySelectorAll('.job-type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.job-type-btn').forEach(b => {
                    b.classList.remove('sx-btn--primary');
                    b.classList.add('sx-btn--secondary');
                });
                btn.classList.remove('sx-btn--secondary');
                btn.classList.add('sx-btn--primary');
                jobType = btn.dataset.val;
                updatePreview();
            });
        });

        function generateLetterText() {
            const name = fields.name.value.trim() || '[Your Name]';
            const title = fields.title.value.trim() || '[Job Title]';
            const company = fields.company.value.trim() || '[Company Name]';
            const location = fields.location.value.trim() || '[Job Location]';
            const exp = fields.exp.value.trim() || '[X] years';
            const skills = fields.skills.value.trim() || '[Key Skills]';
            const degree = fields.degree.value.trim() || '[Academic Degree]';
            const institute = fields.institute.value.trim() || '[Institute Name]';
            const project = fields.project.value.trim();
            const achievement = fields.achievement.value.trim();

            let projectSentence = project ? ` In my portfolio, I recently built ${project}, which sharpened my technical execution and practical problem-solving capabilities.` : '';
            let achievementSentence = achievement ? ` A notable milestone in my recent work has been ${achievement}, reflecting my strong dedication to impactful results.` : '';

            let linksSection = '';
            if (customLinks.length > 0) {
                linksSection = '\n\nHere are my relevant links and websites:\n' + customLinks.map(l => `- ${l.name}: ${l.url}`).join('\n');
            }

            return `Dear Hiring Manager at ${company},

I am thrilled to express my enthusiastic interest in the ${title} position at ${company}, located in ${location} (${jobType}). With ${exp} of experience specializing in ${skills} and a recent ${degree} from ${institute}, I am deeply inspired by ${company}'s vision, culture, and relentless commitment to excellence.${projectSentence}${achievementSentence}

My professional and academic journey has equipped me with a rigorous foundation, unwavering dedication, and a profound passion for solving complex challenges. I am eager to channel this drive into your team, bringing fresh perspectives, proactive execution, and a genuine eagerness to contribute meaningfully from day one.${linksSection}

Thank you for your time and consideration. I would welcome the opportunity to discuss how my background and dedication align with the goals of ${company}.

Warm regards,
${name}`;
        }

        function updatePreview() {
            outputEl.textContent = generateLetterText();
        }

        Object.values(fields).forEach(el => {
            el.addEventListener('input', updatePreview);
            el.addEventListener('change', updatePreview);
        });

        // Add link modal logic
        const linkModal = document.getElementById('link-modal');
        document.getElementById('add-link-btn').addEventListener('click', () => {
            document.getElementById('modal-link-name').value = '';
            document.getElementById('modal-link-url').value = '';
            linkModal.classList.add('active');
        });

        document.getElementById('link-modal-cancel').addEventListener('click', () => {
            linkModal.classList.remove('active');
        });

        document.getElementById('link-modal-submit').addEventListener('click', () => {
            const name = document.getElementById('modal-link-name').value.trim();
            const url = document.getElementById('modal-link-url').value.trim();
            if (!name || !url) {
                alert('Please enter both name and URL.');
                return;
            }
            customLinks.push({ name, url });
            linkModal.classList.remove('active');
            renderLinksList();
        });

        // Copy Text
        document.getElementById('copy-btn').addEventListener('click', () => {
            navigator.clipboard.writeText(generateLetterText());
            const btn = document.getElementById('copy-btn');
            const original = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(() => { btn.textContent = original; }, 1200);
        });

        // Download TXT
        document.getElementById('download-txt-btn').addEventListener('click', () => {
            const blob = new Blob([generateLetterText()], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Cover_Letter_${(fields.title.value.trim() || 'Application').replace(/\s+/g, '_')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Download DOC
        document.getElementById('download-doc-btn').addEventListener('click', () => {
            const text = generateLetterText().replace(/\n/g, '<br>');
            const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Cover Letter</title></head><body style="font-family: Arial, sans-serif; font-size: 11pt; line-height: 1.6; padding: 20px;">${text}</body></html>`;
            const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Cover_Letter_${(fields.title.value.trim() || 'Application').replace(/\s+/g, '_')}.doc`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Download PDF
        document.getElementById('download-pdf-btn').addEventListener('click', () => {
            const printWin = window.open('', '_blank');
            printWin.document.write(`<html><head><title>Cover Letter</title><style>body { font-family: Arial, sans-serif; font-size: 12pt; line-height: 1.8; padding: 40px; color: #000; white-space: pre-wrap; }</style></head><body>${generateLetterText()}</body></html>`);
            printWin.document.close();
            printWin.focus();
            setTimeout(() => { printWin.print(); printWin.close(); }, 500);
        });

        // Send Directly Modal
        const emailModal = document.getElementById('email-modal');
        document.getElementById('send-direct-btn').addEventListener('click', () => {
            const title = fields.title.value.trim() || 'Job Position';
            const company = fields.company.value.trim() || 'Company';
            document.getElementById('modal-subject').value = `Application for ${title} at ${company}`;
            emailModal.classList.add('active');
        });

        document.getElementById('modal-cancel').addEventListener('click', () => {
            emailModal.classList.remove('active');
        });

        document.getElementById('modal-submit').addEventListener('click', () => {
            const email = document.getElementById('modal-email').value.trim();
            const subject = document.getElementById('modal-subject').value.trim();
            const body = generateLetterText();

            if (!email) {
                alert('Please enter a recipient email address.');
                return;
            }

            const mailtoUrl = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
            window.location.href = mailtoUrl;
            emailModal.classList.remove('active');
        });

        // Reset
        document.getElementById('reset-btn').addEventListener('click', () => {
            Object.values(fields).forEach(el => el.value = '');
            fields.name.value = 'Dewan Mukto';
            jobType = 'Remote';
            document.querySelectorAll('.job-type-btn').forEach((b, idx) => {
                b.classList.toggle('sx-btn--primary', idx === 0);
                b.classList.toggle('sx-btn--secondary', idx !== 0);
            });
            customLinks = [
                { name: 'CV / Resume link', url: 'https://dewanmukto.github.io/resume_cs.pdf' },
                { name: 'Portfolio website link', url: 'https://dewanmukto.github.io/' },
                { name: 'GitHub profile link', url: 'https://github.com/dwmk' },
                { name: 'LinkedIn profile link', url: 'https://www.linkedin.com/in/dewanmukto' }
            ];
            renderLinksList();
        });

        renderLinksList();
    </script>
</body>
</html>
