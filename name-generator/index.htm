<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mu's Name Generator</title>
    <link rel="stylesheet" href="/samx-theme.css">
    <style>
        .syllable-display {
            font-family: var(--sx-font-display);
            font-size: clamp(4rem, 15vw, 12rem);
            font-weight: 700;
            letter-spacing: -.06em;
            line-height: 1;
            text-align: center;
            margin: clamp(2rem, 8vw, 6rem) 0;
            cursor: pointer;
            user-select: none;
            transition: transform var(--sx-duration) var(--sx-ease), opacity var(--sx-duration) var(--sx-ease);
        }
        .syllable-display:active {
            transform: scale(0.97);
        }
        .history-scroll-box {
            max-height: 380px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }
        .history-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
        }
        @media (max-width: 520px) {
            .nav-title { display: none; }
        }
    </style>
</head>
<body class="samx-theme">

    <nav class="sx-nav">
        <div class="sx-cluster">
            <span class="sx-pill sx-mono" id="count-pill">0</span>
        </div>
        <div style="font-weight: 700; font-family: var(--sx-font-display); font-size: 0.9rem; text-align: center;" class="nav-title">
            Mu's Name Generator
        </div>
        <div class="sx-cluster">
            <button class="sx-btn sx-btn--secondary" id="auto-btn">Auto</button>
            <button class="sx-btn sx-btn--primary" id="generate-btn">Generate</button>
        </div>
    </nav>

    <main class="sx-container sx-section">
        <div class="sx-panel" style="text-align: center;">
            <div class="syllable-display" id="output">Maka</div>
            <div class="sx-cluster" style="justify-content: center;">
                <button class="sx-btn sx-btn--secondary" id="copy-btn">Copy</button>
            </div>
        </div>

        <div class="sx-section sx-section--compact">
            <div class="sx-section-head">
                <h2 class="sx-heading--section">History</h2>
                <button class="sx-btn sx-btn--secondary" id="clear-btn">Clear</button>
            </div>
            <div class="history-scroll-box">
                <div class="history-grid" id="history"></div>
            </div>
        </div>
    </main>

    <footer class="sx-footer">
        <div class="sx-container" style="display: flex; justify-content: space-between; align-items: center;">
            <span class="sx-mono" id="time-display">00:00:00</span>
            <span class="sx-mono">Made by <a href="https://dewanmukto.github.io/" target="_blank" rel="noopener" style="text-decoration: underline; color: var(--sx-fg);">Dewan Mukto</a></span>
        </div>
    </footer>

    <script>
        const consonants = ['B', 'C', 'D', 'F', 'G', 'H', 'J', 'K', 'L', 'M', 'N', 'P', 'R', 'S', 'T', 'V', 'W', 'Y', 'Z', 'Ch', 'Sh', 'Th'];
        const vowels = ['a', 'e', 'i', 'o', 'u', 'ae', 'ai', 'au', 'ea', 'ee', 'oi', 'ou'];

        function randomChoice(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function generateSyllable() {
            const c1 = randomChoice(consonants);
            const v1 = randomChoice(vowels);
            const c2 = randomChoice(consonants).toLowerCase();
            const v2 = randomChoice(vowels);
            
            const word = c1 + v1 + c2 + v2;
            return word.charAt(0).toUpperCase() + word.slice(1);
        }

        const outputEl = document.getElementById('output');
        const generateBtn = document.getElementById('generate-btn');
        const autoBtn = document.getElementById('auto-btn');
        const copyBtn = document.getElementById('copy-btn');
        const clearBtn = document.getElementById('clear-btn');
        const historyEl = document.getElementById('history');
        const countPill = document.getElementById('count-pill');
        const timeDisplay = document.getElementById('time-display');

        let historyList = [];
        let autoInterval = null;
        let count = 0;

        function updateClock() {
            const now = new Date();
            timeDisplay.textContent = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        function triggerGeneration() {
            outputEl.style.opacity = '0';
            setTimeout(() => {
                const val = generateSyllable();
                outputEl.textContent = val;
                outputEl.style.opacity = '1';
                
                historyList.unshift(val);
                renderHistory();
                
                count++;
                countPill.textContent = count;
            }, 120);
        }

        function renderHistory() {
            historyEl.innerHTML = historyList.map(item => `
                <div class="sx-card sx-card--soft sx-card__body" style="text-align: center; font-family: var(--sx-font-display); font-weight: 700; font-size: 1.25rem;">
                    ${item}
                </div>
            `).join('');
        }

        generateBtn.addEventListener('click', triggerGeneration);
        outputEl.addEventListener('click', triggerGeneration);

        autoBtn.addEventListener('click', () => {
            if (autoInterval) {
                clearInterval(autoInterval);
                autoInterval = null;
                autoBtn.textContent = 'Auto';
                autoBtn.classList.remove('sx-btn--primary');
                autoBtn.classList.add('sx-btn--secondary');
            } else {
                autoInterval = setInterval(triggerGeneration, 800);
                autoBtn.textContent = 'Stop';
                autoBtn.classList.remove('sx-btn--secondary');
                autoBtn.classList.add('sx-btn--primary');
            }
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(outputEl.textContent);
            const originalText = copyBtn.textContent;
            copyBtn.textContent = 'Copied';
            setTimeout(() => { copyBtn.textContent = originalText; }, 1200);
        });

        clearBtn.addEventListener('click', () => {
            historyList = [];
            renderHistory();
        });

        triggerGeneration();
    </script>
</body>
</html>
